name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK with Buildozer (Docker)
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/home/user/hostcwd \
            -w /home/user/hostcwd \
            kivy/buildozer:latest android debug 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        run: |
          echo "===== XATO QISMI ====="
          grep -n -i -B 8 -A 8 "error\|traceback\|failed" build.log | tail -n 120 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: decycle-apk
          path: bin/*.apk
